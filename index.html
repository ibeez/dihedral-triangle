<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Dihedral Group, Fig. 14</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root { --paper:#fbf5e6; --ink:#48545c; color-scheme: light; }
  html, body { background: var(--paper); color: var(--ink); }
  body { margin:0; font-family:"Nunito",system-ui,sans-serif; display:flex; flex-direction:column; align-items:center;
    gap:8px; padding:20px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left)); }
  svg { width:min(100%,600px); height:auto; display:block; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:4px 0 10px; }
  button { font:700 18px/1 "Nunito",system-ui,sans-serif; color:var(--ink); background:#fdeee5; border:2.2px solid var(--ink);
    border-radius:10px; padding:10px 16px; cursor:pointer; box-shadow:3px 2.5px 0 #f1b9a3; }
  button:active { transform:translate(2px,1.5px); box-shadow:1px 1px 0 #f1b9a3; }
  button:focus-visible { outline:2px solid #2a6fd6; outline-offset:3px; }
  button.quiet { background:transparent; box-shadow:none; border-style:dashed; font-size:15px; padding:8px 12px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>
</head>
<body>
<svg id="tri" viewBox="0 0 800 520" role="img"
  aria-label="A triangle with corners 1, 2, 3. Turn it a third of the way round, or flip it over. Turning then flipping lands somewhere different from flipping then turning."></svg>
<div class="controls">
  <button id="turn" type="button">turn</button>
  <button id="flip" type="button">flip</button>
</div>
<svg id="map" viewBox="0 0 800 710" role="img"
  aria-label="The six positions the triangle can be in. Three face up, joined by turn arrows. Three face down, joined by turn arrows the other way. Flip joins each face up position to a face down one."></svg>
<div class="controls">
  <button class="quiet" id="home" type="button">back to e</button>
  <button class="quiet" id="snd" type="button">sound: off</button>
</div>
<div class="sr" aria-live="polite" id="live"></div>

<script>
// MemeParts, inlined from design/meme/parts.js so this page works standalone
// MemeParts: the memetic classroom style in SVG. Ink is exact (Blue Grey B47, even weight);
// colour is the same shape, offset down-right, flat, behind the ink. What Judy approved is in
// meme-lessons.md, and meme-parts.html shows every part.
//
//   const m = MemeParts.piece(svg);          // adds color, ink and words layers to an <svg>
//   m.circle(80, 60, 20, 'coral');           // ink circle, coral fill offset under it
//   m.tag(108, 48, 'sick', 'coral');         // the approved label: a word on a small pale box
//   m.arrow(20, 30, 90, 30);                 // solid ink head
//   m.count(20, 100, 1, 10, '1 in 10 are sick');
//   m.unknown(200, 60, 20);                  // dashed: not known yet
//
// Colours are the four marker inks measured from her swatches (coral, peach, sky, blue), at
// strength t (1 is one pass). Any hex also works. Leave the colour out for ink only.
// Every colour has a job: JOB.mine is warm (my path, the thing that matters), JOB.other is cool.
(function () {
  const PAPER = [251, 245, 230], INK = '#48545c', GREY = '#9faab5';
  const ABS = { coral: [0, 1.09165, .95707], peach: [0, .35405, .36744], sky: [.45222, .13499, 0], blue: [1.14163, .50752, 0] };
  const JOB = { mine: 'coral', other: 'sky', start: 'peach', many: 'blue' };
  const tint = (k, t = 1) => k[0] === '#' ? k : 'rgb(' + PAPER.map((p, i) => Math.round(p * Math.exp(-t * ABS[k][i]))).join() + ')';
  const NS = 'http://www.w3.org/2000/svg';
  const el = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
  const W = 2.2, OX = 3, OY = 2.5, DASH = '5 6';
  // Auto-fit: tag boxes size to the real text width (bold, current font), so words never spill out.
  const ctx = document.createElement('canvas').getContext('2d');
  const measure = (s, size) => { ctx.font = `700 ${size}px ${window.MemeParts && window.MemeParts.FONT || 'Nunito'}, sans-serif`; return Math.ceil(ctx.measureText(s).width); };

  function piece(svg, { ox = OX, oy = OY } = {}) {
    const color = el('g', { transform: `translate(${ox},${oy})` }, svg), ink = el('g', {}, svg), words = el('g', {}, svg);
    const stroke = o => ({ fill: 'none', stroke: o.inkColor || INK, 'stroke-width': o.w || W, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', ...(o.dash ? { 'stroke-dasharray': o.dash } : {}) });
    const under = (o, g) => o.lift ? el('g', { transform: `translate(${o.lift[0] - ox},${o.lift[1] - oy})` }, g) : g;
    const m = {
      color, ink, words, tint, INK, GREY,
      // shapes: k is a colour or null; o.t strength, o.noInk colour only, o.dash dashed ink, o.lift [dx,dy] own offset
      circle(x, y, r, k, o = {}) {
        if (k) el('circle', { cx: x, cy: y, r: r + 1.5, fill: tint(k, o.t) }, under(o, color));
        if (!o.noInk) el('circle', { cx: x, cy: y, r, ...stroke(o) }, ink);
      },
      box(x, y, w, h, k, o = {}) {
        const rx = o.rx ?? 3;
        if (k) el('rect', { x, y, width: w, height: h, rx, fill: tint(k, o.t) }, under(o, color));
        if (!o.noInk) el('rect', { x, y, width: w, height: h, rx, ...stroke(o) }, ink);
      },
      poly(pts, k, o = {}) {
        const d = 'M' + pts.map(p => p.join(',')).join('L') + (o.open ? '' : 'Z');
        if (k) el('path', { d, fill: tint(k, o.t) }, under(o, color));
        if (!o.noInk) el('path', { d, ...stroke(o), ...(o.solid ? { fill: INK } : {}) }, ink);
      },
      line(x1, y1, x2, y2, o = {}) { el('line', { x1, y1, x2, y2, ...stroke(o) }, ink); },
      // a line between two circles [x, y, r] that meets the ink edge, never the colour
      link(a, b, o = {}) {
        const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy), ra = a[2] || 0, rb = b[2] || 0;
        m.line(a[0] + dx / l * ra, a[1] + dy / l * ra, b[0] - dx / l * rb, b[1] - dy / l * rb, o);
      },
      // Approved head is 'solid'. Others kept for the samples: 'open', 'color', 'none'
      arrow(x1, y1, x2, y2, o = {}) {
        const head = o.head || 'solid', s = o.size || 9, a = Math.atan2(y2 - y1, x2 - x1);
        const p = q => [x2 + s * Math.cos(a + q), y2 + s * Math.sin(a + q)];
        const back = head === 'open' || head === 'none' ? 0 : s * 0.8;
        m.line(x1, y1, x2 - back * Math.cos(a), y2 - back * Math.sin(a), o);
        if (head === 'open') m.poly([p(Math.PI * 0.8), [x2, y2], p(-Math.PI * 0.8)], null, { ...o, open: true });
        if (head === 'solid') m.poly([p(Math.PI * 0.82), [x2, y2], p(-Math.PI * 0.82)], null, { ...o, solid: true });
        if (head === 'color') m.poly([p(Math.PI * 0.82), [x2, y2], p(-Math.PI * 0.82)], o.k || 'coral', o);
      },
      // Words in ink, in MemeParts.FONT (Nunito, picked 11/3). o.size, o.anchor (middle), o.weight (700), o.color
      text(x, y, s, o = {}) {
        const t = el('text', { x, y, fill: o.color || INK, 'font-family': (o.font || window.MemeParts.FONT) + ', sans-serif', 'font-weight': o.weight || 700, 'font-size': o.size || 18, 'text-anchor': o.anchor || 'middle', 'dominant-baseline': 'central' }, words);
        t.textContent = s; return t;
      },
      image(href, x, y, w, h) { el('image', { href, x, y, width: w, height: h }, words); },
      // a pixel icon from PixelParts (load pixel/pixel.js and pixel/parts.js, after PixelInk.ready). Rejected for memes; kept for the samples.
      pixel(name, x, y, size) { const c = document.createElement('canvas'); PixelInk.render(c, PixelParts.icon(name), { px: 12 }); m.image(c.toDataURL(), x, y, size, size); },

      // ---- approved parts (round 2, 11/3) ----
      // A label: the word on its own small pale box in the shape's colour, beside the shape. Returns its width.
      tag(x, y, s, k, o = {}) {
        const size = o.size || 18, w = o.width || measure(s, size) + 12, h = size + 6;
        const left = o.anchor === 'end' ? x - w : o.anchor === 'middle' ? x - w / 2 : x;
        m.box(left, y - h / 2, w, h, k, { t: 0.45 });
        m.text(left + 6, y, s, { size, anchor: 'start' });
        return w;
      },
      // A node: circle plus its tag on one side ('right', 'left', 'below').
      node(x, y, r, k, label, side = 'right') {
        m.circle(x, y, r, k);
        if (!label) return [x, y, r];
        if (side === 'right') m.tag(x + r + 8, y, label, k || JOB.other);
        else if (side === 'left') m.tag(x - r - 8, y, label, k || JOB.other, { anchor: 'end' });
        else m.tag(x, y + r + 20, label, k || JOB.other, { anchor: 'middle' });
        return [x, y, r];
      },
      // Not known yet: dashed ink, no colour. Use { dash } on the link that leads to it.
      unknown(x, y, r) { m.circle(x, y, r, null, { dash: DASH }); return [x, y, r]; },
      // A count: the words with digits above, then n warm boxes and the rest cool.
      count(x, y, n, of, words, o = {}) {
        const size = o.box || 18, gap = o.gap || 4, rowW = of * (size + gap) - gap;
        if (words) m.text(x + rowW / 2, y, words, { size: o.size || 24 });
        for (let i = 0; i < of; i++) m.box(x + i * (size + gap), y + (words ? 26 : 0), size, size, i < n ? JOB.mine : JOB.many);
        return rowW;
      },
      // A title: big and bold, centred, on top.
      title(x, y, s, o = {}) { return m.text(x, y, s, { size: 30, ...o }); },
      // Icons built from the style's own shapes, centred on x, y, about 2s across. coin, die, flag
      icon(name, x, y, s = 24, k) {
        if (name === 'coin') { m.circle(x, y, s, k || 'peach'); m.circle(x, y, s * 0.58); }
        if (name === 'die') { m.box(x - s, y - s, 2 * s, 2 * s, k || 'sky', { rx: s * 0.3 }); [-1, 0, 1].forEach(i => m.circle(x + i * s * 0.48, y + i * s * 0.48, s * 0.13, null, { w: s * 0.13 })); }
        if (name === 'flag') { m.box(x - s * 0.6, y - s, s * 1.4, s, k || 'coral'); m.line(x - s * 0.6, y - s, x - s * 0.6, y + s * 1.1); }
      },
    };
    return m;
  }

  // ---- export ----
  // Draws an SVG onto a canvas with the font embedded (latin only), so tools/export.py can record it.
  const FONT_CSS = f => `https://fonts.googleapis.com/css2?family=${f.replace(/ /g, '+')}:wght@400;700&display=swap`;
  const fonts = {};
  const font = f => fonts[f] || (fonts[f] = fetch(FONT_CSS(f)).then(r => r.text()).then(css =>
    Promise.all(css.split('/*').filter(b => b.startsWith(' latin */')).map(async b => {
      const face = b.slice(b.indexOf('@font-face')), url = face.match(/url\((.*?)\)/)[1];
      const blob = await (await fetch(url)).blob();
      const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
      return face.replace(url, data);
    }))).then(a => a.join('')));
  async function toCanvas(svg, canvas) {
    const [, , w, h] = svg.getAttribute('viewBox').split(' ').map(Number), copy = svg.cloneNode(true);
    copy.setAttribute('xmlns', NS); copy.setAttribute('width', w); copy.setAttribute('height', h);
    el('style', {}, copy).textContent = await font(window.MemeParts.FONT);
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(copy));
    await img.decode();
    canvas.width = canvas.width || w * 2; canvas.height = canvas.height || h * 2;
    const g = canvas.getContext('2d'); g.clearRect(0, 0, canvas.width, canvas.height); g.drawImage(img, 0, 0, canvas.width, canvas.height);
  }
  // One line in a piece: if (ExportPage.wanted) MemeParts.export(svg, p => draw(p), EXPORT)
  // draw(p) redraws the svg for p, 0 to 1 through the piece (a still piece can ignore p).
  function exportPiece(svg, draw, EXPORT, opts) {
    const canvas = document.createElement('canvas');
    canvas.width = EXPORT.width; canvas.height = EXPORT.height;
    return ExportPage.run(canvas, async p => { await draw(p); await toCanvas(svg, canvas); }, EXPORT, opts);
  }

  { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = FONT_CSS('Nunito'); document.head.append(l); }
  window.MemeParts = { FONT: 'Nunito', piece, tint, el, toCanvas, export: exportPiece, INK, GREY, PAPER, JOB, DASH, colors: Object.keys(ABS), icons: ['coin', 'die', 'flag'] };
})();
</script>
<script>
// Words read at phone size: the figure shrinks to about half on a phone, so words are drawn bigger (ZOOM).
// { raw: true } skips it (numbers that sit inside a circle).
const ZOOM = 1.35;
function bigText(m) {
  const t = m.text, g = m.tag; let inTag = false;
  m.text = (x, y, s, o = {}) => t(x, y, s, (inTag || o.raw) ? o : { ...o, size: Math.round((o.size || 18) * ZOOM) });
  m.tag = (x, y, s, k, o = {}) => { inTag = true; const r = g(x, y, s, k, { ...o, size: Math.round((o.size || 18) * ZOOM), ...(o.width ? { width: Math.round(o.width * ZOOM) } : {}) }); inTag = false; return r; };
  return m;
}
// export settings for ../design/tools/export.py
const EXPORT = { format: "png", width: 1600, height: 2360, background: "paper" };

const TRI = document.getElementById('tri'), MAP = document.getElementById('map');
const NAMES = { '123': 'e', '312': 'r', '231': 'r²', '132': 'f', '321': 'rf', '213': 'r²f' };
const SLOTS = [-90, 30, 150].map(d => d * Math.PI / 180);          // top, bottom right, bottom left
const MAPPOS = { e: [0, 0], r: [1, 0], 'r²': [2, 0], f: [0, 1], 'r²f': [2, 1], rf: [1, 1] };
const NOTE = { e: 349.2, r: 440, 'r²': 523.3, f: 392, rf: 587.3, 'r²f': 698.5 };
const TCX = 400, TCY = 325, TR = 175, PR = 26;
const MCX = 400, MCY = 345, RO = 260, RI = 100, MR = 28;

let st = { arr: [1, 2, 3], down: false, seen: new Set(['e']), anim: null, busy: false, ends: {}, say: 0 };
let AC = null, muted = true;
const name = () => NAMES[st.arr.join('')];

function ping(f, dur = 0.5, vol = 0.1, type = 'triangle') {
  if (muted || !AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.05);
}
const chime = () => [349.2, 440, 523.3].forEach((f, i) => setTimeout(() => ping(f, 0.9, 0.07), i * 70));

const ease = u => u * u * (3 - 2 * u);
function corners() {   // [x, y, corner number] for the triangle right now
  const a = st.anim;
  return st.arr.map((c, p) => {
    let x = Math.cos(SLOTS[p]), y = Math.sin(SLOTS[p]);
    if (a && a.kind === 'turn') { const ang = SLOTS[p] + a.u * 2 * Math.PI / 3; x = Math.cos(ang); y = Math.sin(ang); }
    if (a && a.kind === 'flip') x *= Math.cos(Math.PI * a.u);
    return [TCX + TR * x, TCY + TR * y, c];
  });
}

function drawTri() {
  TRI.replaceChildren();
  const m = bigText(MemeParts.piece(TRI)), a = st.anim;
  m.tag(16, 26, 'Fig. 14', 'peach', { size: 16 });
  m.title(400, 44, 'turn it, flip it');
  m.text(400, 86, 'a triangle has 6 ways to sit (D3)', { size: 18, weight: 400 });
  const down = a && a.kind === 'flip' ? (a.u > 0.5 ? !st.down : st.down) : st.down;
  const pts = corners();
  m.poly(pts.map(p => [p[0], p[1]]), down ? 'coral' : 'sky', { t: down ? 0.8 : 1, noInk: true });
  [[0, 1], [1, 2], [2, 0]].forEach(([i, j]) => { const A = pts[i], B = pts[j]; if (Math.hypot(A[0] - B[0], A[1] - B[1]) > 2 * PR + 2) m.link([A[0], A[1], PR], [B[0], B[1], PR]); });
  pts.forEach(([x, y, c]) => {
    m.circle(x, y, PR, 'peach', { t: 0.65 });
    m.text(x, y, '' + c, { size: 24, raw: true });
  });
  m.tag(400, 485, down ? 'face down' : 'face up', down ? 'coral' : 'sky', { anchor: 'middle', size: 20 });
}

function mapXY(n) {
  const [slot, ring] = MAPPOS[n], ang = SLOTS[slot], r = ring ? RI : RO;
  return [MCX + r * Math.cos(ang), MCY + r * Math.sin(ang), ang, ring];
}

const SAYS = [
  ['Turn it a third of the way. Flip it over.', 'Six positions in all. The map shows where you are.'],
];

function drawMap() {
  MAP.replaceChildren();
  const m = bigText(MemeParts.piece(MAP)), cur = name(), moving = st.anim;
  // turn arrows: outer clockwise, inner the other way (a face-down triangle turns backwards)
  const loops = [['e', 'r', 'r²'], ['f', 'r²f', 'rf']];
  loops.forEach(loop => loop.forEach((n, i) => {
    const A = mapXY(n), B = mapXY(loop[(i + 1) % 3]), dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    m.arrow(A[0] + ux * (MR + 3), A[1] + uy * (MR + 3), B[0] - ux * (MR + 6), B[1] - uy * (MR + 6), { size: 10 });
  }));
  // flip links
  [['e', 'f'], ['r', 'rf'], ['r²', 'r²f']].forEach(([o, i]) => {
    const A = mapXY(o), B = mapXY(i); m.link([A[0], A[1], MR], [B[0], B[1], MR]);
  });
  Object.keys(MAPPOS).forEach(n => {
    const [x, y, ang, ring] = mapXY(n), here = n === cur && !moving, end = (st.ends.a && n === 'rf') || (st.ends.b && n === 'r²f');
    const k = here ? 'coral' : st.seen.has(n) ? 'coral' : ring ? 'peach' : 'sky';
    m.circle(x, y, MR, k, { t: here || end ? 1.15 : st.seen.has(n) ? 0.55 : 1 });
    const out = ring ? -1 : 1, d = MR + (ring ? 22 : 28);
    m.tag(ring ? x : x + Math.cos(ang) * d, ring ? y + MR + 22 : y + Math.sin(ang) * d, n, k, { anchor: 'middle', size: 20 });
  });
  m.text(MCX, 590, 'arrow: turn · plain line: flip', { size: 16, weight: 400 });
  const nm = name(), [c1, c2] = nm === 'e' ? SAYS[0] : [`you are at ${nm}`, 'Go back to e, then try the same two moves in the other order.']; 
  m.text(MCX, 638, c1, { size: 22 });
  m.text(MCX, 678, c2, { size: 16, weight: 400 });
}
const draw = () => { drawTri(); drawMap(); };

const sleep = ms => new Promise(r => setTimeout(r, ms));
function act(kind) {
  const dur = kind === 'turn' ? 650 : 560, t0 = performance.now();
  return new Promise(res => {
    const f = now => {
      const u = Math.min(1, (now - t0) / dur); st.anim = { kind, u: ease(u) }; draw();
      if (u < 1) return requestAnimationFrame(f);
      st.anim = null;
      st.arr = kind === 'turn' ? [st.arr[2], st.arr[0], st.arr[1]] : [st.arr[0], st.arr[2], st.arr[1]];
      if (kind === 'flip') st.down = !st.down;
      const n = name(); st.seen.add(n);
      n === 'e' ? chime() : kind === 'flip' ? ping(NOTE[n], 0.3, 0.12, 'sine') : ping(NOTE[n]);
      draw(); res();
    };
    requestAnimationFrame(f);
  });
}
async function go(seq, then) {
  if (st.busy) return;
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  st.busy = true;
  for (const k of seq) { await act(k); await sleep(160); }
  st.busy = false;
  if (then) then();
  document.getElementById('live').textContent = 'Now at ' + name() + (st.down ? ', face down.' : ', face up.');
  draw();
}
function home() {
  if (st.busy) return;
  st = { arr: [1, 2, 3], down: false, seen: new Set(['e']), anim: null, busy: false, ends: {}, say: 0 }; draw();
}
document.getElementById('turn').onclick = () => go(['turn']);
document.getElementById('flip').onclick = () => go(['flip']);
document.getElementById('home').onclick = home;
document.getElementById('snd').onclick = e => {
  muted = !muted; e.target.textContent = 'sound: ' + (muted ? 'off' : 'on');
  if (!muted && !AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (er) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  if (!muted) ping(NOTE.e);
};
addEventListener('keydown', e => { if (e.key === 't') go(['turn']); if (e.key === 'f') go(['flip']); });

draw();
if (document.fonts) document.fonts.ready.then(draw);
</script>
</body>
</html>
